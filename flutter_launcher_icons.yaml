# App icons for Android, iOS and web, generated from the Crown & Blade logo
# (lib/core/brand/crown_blade_logo.dart, exported to assets/brand/ by
# test/brand/generate_brand_assets_test.dart). The icon is the white mark on
# the brand green gradient (#22C55E -> #15803D). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/icon-1024.png"

  android: "ic_launcher"
  min_sdk_android: 21
  # Adaptive icon (Android 8+): the white mark over the green gradient.
  adaptive_icon_background: "assets/brand/icon-background-1024.png"
  adaptive_icon_foreground: "assets/brand/icon-foreground-1024.png"
  # The foreground PNGs already keep the mark inside the 66 dp safe zone of
  # the 108 dp canvas: no extra inset (the tool's default is 16%).
  adaptive_icon_foreground_inset: 0
  # Android 13 themed icon.
  adaptive_icon_monochrome: "assets/brand/icon-monochrome-1024.png"

  ios: true
  remove_alpha_ios: true
  background_color_ios: "#16A34A"

  web:
    generate: true
    image_path: "assets/brand/icon-1024.png"
    background_color: "#FFFFFF"
    theme_color: "#16A34A"
