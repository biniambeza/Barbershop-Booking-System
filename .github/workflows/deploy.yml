name: Build & Deploy Crown & Blade (Web & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "deployment"
  cancel-in-progress: true

jobs:
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Test Firestore security rules
        working-directory: firestore-tests
        run: |
          npm ci
          npm test

  functions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codebase: [ notifications, payments ]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/${{ matrix.codebase }}/package-lock.json

      - name: Build and test functions/${{ matrix.codebase }}
        working-directory: functions/${{ matrix.codebase }}
        run: |
          npm ci
          npm run build
          npm test

  seed-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tool/seed/package-lock.json

      - name: Test seed script
        working-directory: tool/seed
        run: |
          npm ci
          npm test

  build-and-deploy:
    needs: [ firestore-rules, functions, seed-script ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      # The public GitHub Pages site is an offline demo (no Firebase, demo
      # logins, OTP 123456). Production builds omit DEMO_MODE.
      - name: Build Web Application (demo)
        run: flutter build web --release --dart-define=DEMO_MODE=true --base-href "/Barbershop-Booking-System/"

      - name: Deploy Web App to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true

      - name: Build Android Release APK (demo)
        continue-on-error: true
        run: flutter build apk --release --dart-define=DEMO_MODE=true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: CrownAndBlade-Android-App
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
