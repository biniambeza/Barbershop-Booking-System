<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Crown & Blade - Premium Barbershop Booking System">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#18181B">
  <meta name="apple-mobile-web-app-title" content="Crown & Blade">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Crown & Blade - Barbershop Booking</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #18181B;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes cb-spin {
      to { transform: rotate(360deg); }
    }
    #loading-indicator {
      transition: opacity 0.4s ease-out;
    }
  </style>
</head>
<body>
  <!-- Start-up loader: the Crown & Blade mark on the ink background, the
       same size and place as the native splash and the first frame of the
       Flutter intro (lib/features/splash/animated_splash.dart), which then
       takes over. -->
  <div id="loading-indicator" role="progressbar" aria-label="Crown &amp; Blade" style="position: fixed; inset: 0; background: #18181B; z-index: 99999;">
    <img src="icons/logo-mark.png" alt="" width="128" height="128" style="position: absolute; left: 50%; top: 50%; width: 128px; height: 128px; transform: translate(-50%, -50%);">
    <div style="position: absolute; left: 50%; top: calc(50% + 120px); width: 28px; height: 28px; margin-left: -14px; box-sizing: border-box; border: 2.5px solid rgba(255,255,255,0.12); border-top-color: #22B14C; border-radius: 50%; animation: cb-spin 0.9s linear infinite;"></div>
  </div>

  <script>
    function dismissLoader() {
      var el = document.getElementById('loading-indicator');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function() { if (el && el.parentNode) el.parentNode.removeChild(el); }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', dismissLoader);
    var obs = new MutationObserver(function(muts) {
      for (var i = 0; i < muts.length; i++) {
        for (var j = 0; j < muts[i].addedNodes.length; j++) {
          var tag = (muts[i].addedNodes[j].tagName || '').toLowerCase();
          if (tag === 'flt-glass-pane' || tag === 'flutter-view') {
            dismissLoader();
            obs.disconnect();
            return;
          }
        }
      }
    });
    obs.observe(document.body, { childList: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
