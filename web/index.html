<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Crown & Blade - Premium Barbershop Booking System">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crown & Blade">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Crown & Blade - Barbershop Booking</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #111215;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes cb-spin {
      to { transform: rotate(360deg); }
    }
    #loading-indicator {
      transition: opacity 0.4s ease-out;
    }
  </style>
</head>
<body>
  <div id="loading-indicator" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111215; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; z-index: 99999;">
    <div style="width: 58px; height: 58px; border-radius: 16px; background: rgba(212,175,55,0.15); border: 1.5px solid rgba(212,175,55,0.4); display: flex; align-items: center; justify-content: center; margin-bottom: 20px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"></circle>
        <circle cx="6" cy="18" r="3"></circle>
        <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
        <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
        <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
      </svg>
    </div>
    <div style="font-size: 22px; font-weight: 700; letter-spacing: 1.5px; color: #D4AF37; margin-bottom: 6px;">CROWN &amp; BLADE</div>
    <div style="font-size: 13px; color: #8C8D95; margin-bottom: 28px; letter-spacing: 0.5px;">Premium Barbershop Booking</div>
    <div style="width: 36px; height: 36px; border: 3px solid rgba(212,175,55,0.2); border-top-color: #D4AF37; border-radius: 50%; animation: cb-spin 0.9s linear infinite;"></div>
    <div style="font-size: 12px; color: #6E707A; margin-top: 14px;">Loading application...</div>
  </div>

  <script>
    function dismissLoader() {
      var el = document.getElementById('loading-indicator');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function() { if (el && el.parentNode) el.parentNode.removeChild(el); }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', dismissLoader);
    var obs = new MutationObserver(function(muts) {
      for (var i = 0; i < muts.length; i++) {
        for (var j = 0; j < muts[i].addedNodes.length; j++) {
          var tag = (muts[i].addedNodes[j].tagName || '').toLowerCase();
          if (tag === 'flt-glass-pane' || tag === 'flutter-view') {
            dismissLoader();
            obs.disconnect();
            return;
          }
        }
      }
    });
    obs.observe(document.body, { childList: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
