# Native launch screen (shown before Flutter draws its first frame): the
# green mark on white, or on near-black when the device is in dark mode. The
# Flutter intro in lib/features/splash/ starts on exactly the same picture
# (same logo, size, place and background for the device brightness), so the
# hand-off is seamless. Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  # CrownBladeLogo.splashLight / splashDark
  color: "#FFFFFF"
  image: assets/brand/splash-logo-plain-512.png
  color_dark: "#0A0A0A"
  image_dark: assets/brand/splash-logo-plain-dark-512.png

  # No icon_background_color: with one, Android 12+ draws the icon at
  # 240 dp instead of 288 dp, and the mark would jump in size when the
  # Flutter intro (288 dp canvas, IntroTimeline.logoCanvas) takes over.
  android_12:
    image: assets/brand/splash-logo-1152.png
    color: "#FFFFFF"
    image_dark: assets/brand/splash-logo-dark-1152.png
    color_dark: "#0A0A0A"

  android: true
  ios: true
  # Web keeps its own loader in web/index.html (same backgrounds and mark,
  # light / dark by prefers-color-scheme): this package is a dev dependency,
  # so its web splash would never be removed.
  web: false

  android_gravity: center
  ios_content_mode: center

  fullscreen: false
